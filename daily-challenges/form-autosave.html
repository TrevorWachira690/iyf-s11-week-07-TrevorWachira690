

Day3 form autosave · HTML
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Day 3 — Form Auto-Save</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 16px; }
    form { display: flex; flex-direction: column; gap: 12px; }
    input, textarea { padding: 10px; font-size: 16px; font-family: inherit; }
    button { padding: 10px 16px; font-size: 16px; cursor: pointer; }
    #status { min-height: 22px; margin-bottom: 12px; color: #555; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Form Auto-Save</h1>
  <div id="status">Waiting for changes…</div>
 
  <form id="contact-form">
    <input name="fullName" type="text" placeholder="Full name" required />
    <input name="email" type="email" placeholder="Email" required />
    <textarea name="message" rows="4" placeholder="Message" required></textarea>
    <button type="submit">Submit</button>
  </form>
 
  <script>
    // ==========================================================
    // DAY 3 — Form Auto-Save
    // - Auto-saves all fields every 5 seconds
    // - Recovers data on page refresh
    // - Clears saved data on submit
    // ==========================================================
 
    const STORAGE_KEY = "autosave_form";
    const form = document.querySelector("#contact-form");
    const statusEl = document.querySelector("#status");
    const inputs = form.querySelectorAll("input, textarea");
 
    // ----------------------------------------------------------
    // Save all current field values as one object, under one key
    // ----------------------------------------------------------
    function saveFormData() {
      const data = {};
      inputs.forEach(input => {
        data[input.name] = input.value;
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
 
      const time = new Date().toLocaleTimeString();
      statusEl.textContent = `Auto-saved at ${time}`;
    }
 
    // ----------------------------------------------------------
    // Recover saved data (runs once, on page load)
    // ----------------------------------------------------------
    function recoverFormData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) {
        return;
      }
 
      const data = JSON.parse(saved);
      inputs.forEach(input => {
        if (data[input.name] !== undefined) {
          input.value = data[input.name];
        }
      });
 
      statusEl.textContent = "Recovered your unsaved changes.";
    }
 
    // ----------------------------------------------------------
    // Clear saved data (runs on successful submit)
    // ----------------------------------------------------------
    function clearFormData() {
      localStorage.removeItem(STORAGE_KEY);
      statusEl.textContent = "Submitted — saved draft cleared.";
    }
 
    // ==========================================================
    // Auto-save every 5 seconds
    // ==========================================================
    setInterval(saveFormData, 5000);
 
    // ==========================================================
    // Handle submit: prevent real page reload (demo only),
    // then clear the draft
    // ==========================================================
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      clearFormData();
      form.reset();
    });
 
    // ==========================================================
    // On page load: try to recover any unsaved draft
    // ==========================================================
    recoverFormData();
  </script>
</body>
</html>
